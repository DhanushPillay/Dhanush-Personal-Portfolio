<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes anim-center {
      0%, 25% { transform: scale(1.5); fill: #e34234; }
      33%, 58% { transform: scale(1.5); fill: #0274b3; }
      66%, 91% { transform: scale(1.5); fill: #fbbf24; }
      100% { transform: scale(1.5); fill: #e34234; }
    }
    @keyframes anim-row {
      0%, 25% { transform: scale(1); fill: #d4d4d8; stroke-width: 0; }
      33%, 58% { transform: scale(1.5); fill: #0274b3; stroke-width: 2; }
      66%, 91% { transform: scale(1.5); fill: #fbbf24; stroke-width: 2; }
      100% { transform: scale(1); fill: #d4d4d8; stroke-width: 0; }
    }
    @keyframes anim-other {
      0%, 58% { transform: scale(1); fill: #d4d4d8; stroke-width: 0; }
      66%, 91% { transform: scale(1.5); fill: #fbbf24; stroke-width: 2; }
      100% { transform: scale(1); fill: #d4d4d8; stroke-width: 0; }
    }
    
    rect.dot {
      transform-origin: center;
      transform-box: fill-box;
      stroke: #1c1c1c;
      stroke-width: 2;
    }
    
    .c { animation: anim-center 6s infinite cubic-bezier(0.87, 0, 0.13, 1); }
    .r { animation: anim-row 6s infinite cubic-bezier(0.87, 0, 0.13, 1); }
    .o { animation: anim-other 6s infinite cubic-bezier(0.87, 0, 0.13, 1); }
  </style>
  
  <!-- Outer container with heavy Brutalist border -->
  <rect x="0" y="0" width="100" height="100" fill="#f5f5f7" stroke="#1c1c1c" stroke-width="12" />
  
  <!-- Top row -->
  <rect x="18" y="18" width="16" height="16" class="dot o" />
  <rect x="42" y="18" width="16" height="16" class="dot o" />
  <rect x="66" y="18" width="16" height="16" class="dot o" />
  
  <!-- Middle row -->
  <rect x="18" y="42" width="16" height="16" class="dot r" />
  <rect x="42" y="42" width="16" height="16" class="dot c" />
  <rect x="66" y="42" width="16" height="16" class="dot r" />
  
  <!-- Bottom row -->
  <rect x="18" y="66" width="16" height="16" class="dot o" />
  <rect x="42" y="66" width="16" height="16" class="dot o" />
  <rect x="66" y="66" width="16" height="16" class="dot o" />
</svg>